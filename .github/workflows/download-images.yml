name: Download and optimize Tabiat Olami images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Download and optimize images
        run: |
          python scripts/download_images.py

      - name: Show image results
        run: |
          echo "Images:"
          find public/images -maxdepth 1 -type f | sort
          echo ""
          echo "Manifest:"
          python - <<'PY'
          import json

          with open("public/images/manifest.json", encoding="utf-8") as f:
              data = json.load(f)

          ok = [x for x in data if x["status"] == "ok"]
          bad = [x for x in data if x["status"] != "ok"]

          print("OK:", len(ok))
          print("FAILED:", len(bad))

          for x in bad:
              print(
                  "FAILED:",
                  x["id"],
                  x["name"],
                  x["status"]
              )
          PY

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/images

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add optimized educational images"
            git push
          fi
