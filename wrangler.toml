name = "tabiat-olami-mini-app"
main = "src/worker.js"
compatibility_date = "2026-10-05"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "tabiat-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
PUBLIC_APP_URL = "https://YOUR-DOMAIN.example.com"

Secrets are NOT stored here.

Set them in Cloudflare:

ADMIN_PASSWORD

TELEGRAM_BOT_TOKEN

TELEGRAM_WEBHOOK_SECRET
