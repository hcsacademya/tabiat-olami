<!doctype html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Tabiat Olami</title><link rel="stylesheet" href="/admin.css"></head><body><div class="wrap"><header><h1>🌿 Tabiat Olami — Admin</h1><a href="/">Mini App</a></header><section id="login" class="card"><h2>Admin kirish</h2><input id="password" type="password" placeholder="Admin paroli"><button id="loginBtn">Kirish</button><p id="loginMsg"></p></section><section id="panel" class="hidden"><div class="grid"><div class="card"><h2>Kategoriya qo‘shish</h2><input id="catName" placeholder="Masalan: Qushlar"><input id="catIcon" placeholder="Emoji, masalan 🐦"><button id="addCat">Qo‘shish</button><div id="catList"></div></div><div class="card"><h2>Yangi rasmli narsa qo‘shish</h2><select id="itemCat"></select><input id="itemName" placeholder="Nomi"><textarea id="itemDesc" placeholder="Qisqa ma’lumot (ixtiyoriy)"></textarea><input id="itemFile" type="file" accept="image/*"><button id="uploadBtn">Rasmni yuklash</button><input id="itemUrl" placeholder="Yoki rasm URL manzili"><button id="addItem">Saqlash</button><p id="itemMsg"></p></div></div><div class="card"><h2>Mavjud narsalar</h2><select id="filterCat"></select><div id="itemsList"></div></div></section></div><script src="/admin.js"></script></body></html>
